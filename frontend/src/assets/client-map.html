<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeliverXY Client Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .leaflet-control-zoom { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map("map", { zoomControl: false }).setView([41.9981, 21.4254], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    let pickupMarker = null;
    let dropoffMarker = null;
    let userMarker = null;

    map.on("click", (e) => {
      if (window.nsEmit) {
        window.nsEmit({ type: "tap", data: { lat: e.latlng.lat, lng: e.latlng.lng } });
      }
    });

    window.setUserLocation = function (lat, lng) {
      if (!userMarker) {
        userMarker = L.circleMarker([lat, lng], {
          radius: 8, color: "#000", fillColor: "#000", fillOpacity: 1, weight: 2
        }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
      }
    };

    window.setPickupMarker = function (lat, lng) {
      if (pickupMarker) map.removeLayer(pickupMarker);
      pickupMarker = L.marker([lat, lng]).addTo(map).bindPopup("Pickup");
    };

    window.setDropoffMarker = function (lat, lng) {
      if (dropoffMarker) map.removeLayer(dropoffMarker);
      dropoffMarker = L.marker([lat, lng]).addTo(map).bindPopup("Dropoff");
    };

    window.removePickupMarker = function () {
      if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
    };

    window.removeDropoffMarker = function () {
      if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
    };

    window.setMapCenter = function (lat, lng, zoom) {
      map.setView([lat, lng], zoom || map.getZoom());
    };

    window.nsReady = true;
  </script>
</body>
</html>

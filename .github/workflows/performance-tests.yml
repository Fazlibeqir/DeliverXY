name: Performance Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'performance-tests/**'
      - '.github/workflows/performance-tests.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'k6 test type to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak

concurrency:
  group: performance-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: http://localhost:8080
      TEST_USER_EMAIL: perf-ci@deliverxy.test
      TEST_USER_PASSWORD: Password123!
      TEST_USER_IDENTIFIER: perf-ci@deliverxy.test
      REGISTER_TEST_USER: 'true'
      AUTH_ENABLED: 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start DeliverXY services
        run: |
          docker compose up -d postgres backend

      - name: Wait for backend health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for backend... attempt $i"
            sleep 5
          done
          docker compose logs backend
          exit 1

      - name: Set selected test
        id: selected-test
        run: |
          TEST_TYPE="${{ github.event.inputs.test_type }}"
          if [ -z "$TEST_TYPE" ]; then
            TEST_TYPE="smoke"
          fi
          echo "test_type=$TEST_TYPE" >> "$GITHUB_OUTPUT"

      - name: Run k6 performance test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: performance-tests/k6/${{ steps.selected-test.outputs.test_type }}.js
          flags: --summary-export performance-tests/results/${{ steps.selected-test.outputs.test_type }}-summary.json
        env:
          BASE_URL: ${{ env.BASE_URL }}
          TEST_USER_EMAIL: ${{ env.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ env.TEST_USER_PASSWORD }}
          TEST_USER_IDENTIFIER: ${{ env.TEST_USER_IDENTIFIER }}
          REGISTER_TEST_USER: ${{ env.REGISTER_TEST_USER }}
          AUTH_ENABLED: ${{ env.AUTH_ENABLED }}

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ steps.selected-test.outputs.test_type }}-summary
          path: performance-tests/results/*.json
          if-no-files-found: ignore

      - name: Print service logs on failure
        if: failure()
        run: |
          docker compose logs postgres backend

      - name: Stop services
        if: always()
        run: |
          docker compose down -v
